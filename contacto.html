<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f4f4f4;
        }


        h1 {
            color: #ffffff;
            background-color: #001020;
            padding: 15px;
            border-radius: 10px;
        }

        /* Estilos del formulario */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            color: #001020;
        }

        input, textarea {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        /* Estilos del botón */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin-top: 15px;
            background-color: #001020;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s ease-in-out;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #003366;
        }

        /* Enlace a la página principal */
        .footer {
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Contacto</h1>

        <p>Puedes enviarme un mensaje llenando el siguiente formulario:</p>

        <form action="#" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" required></textarea>

            <button type="submit" class="btn">Enviar Mensaje</button>
        </form>

        <div class="footer">
            <a href="../parcial/index.html" class="btn">Regresar a la Página Principal</a>
        </div>
    </div>

</body>
</html>
